x-custom-image: &custom_image
  image: ${IMAGE_NAME:-docker.io/frappe/erpnext}:${VERSION:-version-16}
  pull_policy: ${PULL_POLICY:-always}
  deploy:
    restart_policy:
      condition: on-failure
      max_attempts: 3
  environment:
    - REDIS_CACHE=${REDIS_CACHE:-redis-cache:6379}
    - REDIS_QUEUE=${REDIS_QUEUE:-redis-queue:6379}
    - EDUCATION_REPO=${EDUCATION_REPO:-https://github.com/DevOpsEdupan/escazu-education}
    - INSTALL_EDUCATION=${INSTALL_EDUCATION:-1}

services:
  # ──────────────────────────────────────────────
  #  BACKEND  (Gunicorn / WSGI)
  # ──────────────────────────────────────────────
  backend:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec /home/frappe/frappe-bench/env/bin/gunicorn
          --chdir /home/frappe/frappe-bench
          --bind 0.0.0.0:8000
          --workers ${GUNICORN_WORKERS:-2}
          --timeout 120
          frappe.app:application --preload;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8000"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ──────────────────────────────────────────────
  #  FRONTEND  (Nginx)
  # ──────────────────────────────────────────────
  frontend:
    <<: *custom_image
    command: ["nginx-entrypoint.sh"]
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-0.0.0.0/0}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"
    ports:
      - "${HTTP_PORT:-8080}:8080"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8080"]
      interval: 5s
      timeout: 30s
      retries: 30

  # ──────────────────────────────────────────────
  #  WEBSOCKET  (Socket.IO)
  # ──────────────────────────────────────────────
  websocket:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec node /home/frappe/frappe-bench/apps/frappe/socketio.js;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:9000"]
      interval: 5s
      timeout: 10s
      retries: 30

  # ──────────────────────────────────────────────
  #  WORKERS
  # ──────────────────────────────────────────────
  queue-default:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec bench worker --queue default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      backend:
        condition: service_healthy

  queue-long:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec bench worker --queue long
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      backend:
        condition: service_healthy

  queue-short:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec bench worker --queue short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  SCHEDULER
  # ──────────────────────────────────────────────
  scheduler:
    <<: *custom_image
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        exec bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    depends_on:
      backend:
        condition: service_healthy

  # ──────────────────────────────────────────────
  #  ONE-OFF JOBS  (replicas=0 por defecto)
  # ──────────────────────────────────────────────
  configurator:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CONFIGURE:-0}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        [[ $${REGENERATE_APPS_TXT} == "1" ]] && ls -1 apps > sites/apps.txt;
        bench set-config -g  db_host        $$DB_HOST;
        bench set-config -gp db_port        $$DB_PORT;
        bench set-config -g  redis_cache    "redis://$$REDIS_CACHE";
        bench set-config -g  redis_queue    "redis://$$REDIS_QUEUE";
        bench set-config -g  redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port  $$SOCKETIO_PORT;
        [[ $${INSTALL_EDUCATION} == "1" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO} --overwrite;
    environment:
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      REDIS_CACHE: "${REDIS_CACHE:-redis-cache:6379}"
      REDIS_QUEUE: "${REDIS_QUEUE:-redis-queue:6379}"
      SOCKETIO_PORT: "9000"
      REGENERATE_APPS_TXT: "${REGENERATE_APPS_TXT:-1}"
      INSTALL_EDUCATION: "${INSTALL_EDUCATION:-1}"
      EDUCATION_REPO: "${EDUCATION_REPO:-https://github.com/DevOpsEdupan/escazu-education}"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  create-site:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${CREATE_SITE:-0}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 $$DB_HOST:$$DB_PORT;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        start=$$(date +%s);
        until [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".db_host    // empty") ]] &&
              [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty") ]] &&
              [[ -n $$(grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty") ]];
        do
          echo "Esperando common_site_config.json...";
          sleep 5;
          if (( $$(date +%s) - start > 120 )); then
            echo "Timeout: common_site_config.json sin las claves requeridas"; exit 1;
          fi;
        done;
        echo "common_site_config.json listo";
        [[ -d "sites/$${SITE_NAME}" ]] && echo "$${SITE_NAME} ya existe" && exit 0;
        [[ $${INSTALL_EDUCATION} == "1" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        bench new-site \
          --mariadb-user-host-login-scope='%' \
          --admin-password=$${ADMIN_PASSWORD} \
          --db-root-username=root \
          --db-root-password=$${DB_ROOT_PASSWORD} \
          $${INSTALL_APP_ARGS} \
          $${SITE_NAME};
        bench --site $${SITE_NAME} set-config -g default_site $${SITE_NAME};
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    environment:
      SITE_NAME: "${SITE_NAME}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      INSTALL_APP_ARGS: "${INSTALL_APP_ARGS:---install-app erpnext --install-app education}"
      INSTALL_EDUCATION: "${INSTALL_EDUCATION:-1}"
      EDUCATION_REPO: "${EDUCATION_REPO:-https://github.com/DevOpsEdupan/escazu-education}"
    networks:
      - bench-network
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  migration:
    <<: *custom_image
    deploy:
      mode: replicated
      replicas: ${MIGRATE:-0}
      restart_policy:
        condition: none
    entrypoint: ["bash", "-c"]
    command:
      - >
        mkdir -p /home/frappe/logs && chmod 777 /home/frappe/logs;
        [[ $${INSTALL_EDUCATION} == "1" && ! -d "apps/education" ]] &&
          bench get-app --branch version-16 $${EDUCATION_REPO};
        echo "Esperando frontend:8080...";
        wait-for-it -t 120 frontend:8080;
        echo "Frontend listo, iniciando migración...";
        bench --site $${SITE_NAME} set-config -p maintenance_mode 1;
        bench --site $${SITE_NAME} set-config -p pause_scheduler  1;
        bench --site $${SITE_NAME} migrate;
        bench --site $${SITE_NAME} set-config -p maintenance_mode 0;
        bench --site $${SITE_NAME} set-config -p pause_scheduler  0;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/logs
    networks:
      - bench-network
    environment:
      SITE_NAME: "${SITE_NAME}"
      INSTALL_EDUCATION: "${INSTALL_EDUCATION:-1}"
      EDUCATION_REPO: "${EDUCATION_REPO:-https://github.com/DevOpsEdupan/escazu-education}"

  # ──────────────────────────────────────────────
  #  BASE DE DATOS
  # ──────────────────────────────────────────────
  db:
    image: mariadb:10.6
    deploy:
      mode: replicated
      replicas: ${ENABLE_DB:-1}
      restart_policy:
        condition: on-failure
    healthcheck:
      test: mysqladmin ping -h localhost --password=${DB_ROOT_PASSWORD}
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - bench-network

  # ──────────────────────────────────────────────
  #  REDIS
  # ──────────────────────────────────────────────
  redis-cache:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-cache-data:/data
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:6.2-alpine
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data
    networks:
      - bench-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  redis-cache-data:
  redis-queue-data:
  sites:
    driver_opts:
      type: "${SITE_VOLUME_TYPE:-none}"
      o: "${SITE_VOLUME_OPTS:-bind}"
      device: "${SITE_VOLUME_DEV:-./sites}"
  logs:

networks:
  bench-network:
    driver: bridge