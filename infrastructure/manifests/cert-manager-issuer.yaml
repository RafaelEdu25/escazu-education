apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: leonardo_franco@edupan.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: frappe-gateway
                namespace: frappe
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: leonardo_franco@edupan.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: frappe-gateway
                namespace: frappe
                kind: Gateway
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: frappe-tls
  namespace: frappe
spec:
  secretName: frappe-tls
  issuerRef:
    name: letsencrypt-prod   # switch to letsencrypt-staging for testing
    kind: ClusterIssuer
  dnsNames:
    - education.escazu.edupan.dev
