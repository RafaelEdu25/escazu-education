#   kubectl create secret generic frappe-db-secret \
#     --from-literal=db-password='<password>' \
#     --namespace=frappe
apiVersion: v1
kind: Secret
metadata:
  name: frappe-db-secret
  namespace: frappe
type: Opaque
data:
  db-password: ""   # base64 of password
