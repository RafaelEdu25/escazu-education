# Generate with (do NOT commit plain PAT — use SealedSecret or CI injection):
#
#   kubectl create secret docker-registry ghcr-pull-secret \
#     --docker-server=ghcr.io \
#     --docker-username=<github-user> \
#     --docker-password=<ghcr-pat> \
#     --namespace=frappe \
#     --dry-run=client -o yaml
#
# Then seal with kubeseal or inject .dockerconfigjson via CI secret.
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: frappe
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: ""   # replace with base64-encoded docker config JSON
